version: "2.1"
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      - /mnt/media:/mnt/media
      - /mnt/downdisk01:/mnt/downdisk01
    ports:
      - 8989:8989
    restart: unless-stopped
