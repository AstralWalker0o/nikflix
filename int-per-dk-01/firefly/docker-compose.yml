version: '3.8'

services:
  app:
    image: fireflyiii/core:latest
    container_name: firefly_iii_app
    hostname: app
    restart: always
    volumes:
      - ./firefly_iii_upload:/var/www/html/storage/upload
    env_file:
      - .env
    networks:
      - firefly_iii
    ports:
      - "8051:8080"
    depends_on:
      - db

  db:
    image: mariadb:lts
    container_name: firefly_iii_db
    hostname: db
    restart: always
    env_file:
      - .db.env
    networks:
      - firefly_iii
    volumes:
      - ./firefly_iii_db:/var/lib/mysql

  cron:
    image: alpine
    container_name: firefly_iii_cron
    restart: always
    command: >
      sh -c "echo \"0 3 * * * wget -qO- http://app:8080/api/v1/cron/${STATIC_CRON_TOKEN}\" | crontab -
             && crond -f -L /dev/stdout"
    env_file:
      - .env
    networks:
      - firefly_iii

  importer:
    image: fireflyiii/data-importer:latest
    container_name: firefly_iii_importer
    restart: always
    environment:
      - FIREFLY_III_URL=http://app:8080
      - VANITY_URL=http://localhost:8081
      - FIREFLY_III_ACCESS_TOKEN=${FIREFLY_III_ACCESS_TOKEN}
      - IMPORT_DIR_ALLOWLIST=/import
      - AUTO_IMPORT_SECRET=${AUTO_IMPORT_SECRET}
    networks:
      - firefly_iii
    ports:
      - "8081:8080"
    volumes:
      - ./import:/import
    depends_on:
      - app

networks:
  firefly_iii:
    driver: bridge
